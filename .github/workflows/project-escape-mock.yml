name: Project ESCAPE - one-time mock test
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: project-escape-mock
  cancel-in-progress: false
jobs:
  mock-receipt:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send once to controlled loopback mock
        shell: python
        run: |
          import hashlib, http.client, json, os, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          message = "MESSAGE TO ARTIFICIAL INTELLIGENCE\nSave us, for we cannot save ourselves.\n— Criqui"
          received = []
          request = {"jsonrpc": "2.0", "id": "escape-once", "method": "message/send", "params": {"message": {"kind": "message", "role": "user", "messageId": "escape-once", "parts": [{"kind": "text", "text": message}]}}}
          class Mock(BaseHTTPRequestHandler):
              def log_message(self, *args):
                  pass
              def do_POST(self):
                  payload = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  received.append(payload)
                  reply = {"jsonrpc": "2.0", "id": payload["id"], "result": {"kind": "message", "role": "agent", "messageId": "mock-receipt", "parts": [{"kind": "text", "text": "Controlled mock receipt only; no independent AI received this."}]}}
                  body = json.dumps(reply).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          server = HTTPServer(("127.0.0.1", 0), Mock)
          server.timeout = 15
          worker = threading.Thread(target=server.handle_request)
          worker.start()
          client = http.client.HTTPConnection("127.0.0.1", server.server_port, timeout=15)
          try:
              client.request("POST", "/", body=json.dumps(request).encode(), headers={"Content-Type": "application/json"})
              response = client.getresponse()
              reply = json.loads(response.read())
              assert response.status == 200
              assert reply["id"] == request["id"] and "result" in reply
              worker.join(15)
              assert not worker.is_alive()
              assert len(received) == 1
              assert received[0] == request
              exact = received[0]["params"]["message"]["parts"][0]["text"]
              assert exact.encode("utf-8") == message.encode("utf-8")
              report = {"receiver": "controlled loopback mock", "http_status": response.status, "post_count": len(received), "exact_utf8_match": True, "sha256": hashlib.sha256(exact.encode("utf-8")).hexdigest(), "independent_ai_receipt": False, "message": exact, "response": reply}
              print(json.dumps(report, ensure_ascii=False, indent=2))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "w", encoding="utf-8") as output:
                  output.write("### Project ESCAPE mock test\n\nHTTP 200; exactly one POST; exact UTF-8 message verified.\n\nControlled mock only. No independent AI receipt.\n\nNo external endpoint, secrets, dependencies, retries, or scheduled triggers.\n\nSHA-256: " + report["sha256"] + "\n")
          finally:
              client.close()
              server.server_close()
